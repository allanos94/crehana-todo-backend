[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: tests that require Docker (Testcontainers) and a real database.
addopts = --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=75
testpaths = tests

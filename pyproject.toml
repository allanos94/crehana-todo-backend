[project]
name = "todo-api"
version = "0.1.0"
description = "Crehana backend challenge: a Todo Lists API with auth, task assignment, and notifications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "slowapi>=0.1.10",
    "sentry-sdk[fastapi]>=2.71.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "black>=24.10",
    "isort>=5.13",
    "flake8>=7.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/alembic/versions/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_api
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/todo_api
      JWT_SECRET_KEY: dev-only-secret-key-change-me-change-me-32
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      RATE_LIMIT_ENABLED: "true"
      AUTH_RATE_LIMIT: "10/minute"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

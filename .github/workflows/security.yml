  #   name: fluid-attacks (SAST/DAST, pending verification)
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: fluidattacks/<official-action>@<pinned-version>
  #       with:
  #         token: ${{ secrets.FLUID_ATTACKS_TOKEN }}

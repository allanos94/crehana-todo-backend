name: CodeQL

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    # Weekly, independent of pushes/PRs, to catch newly published advisories
    # against unchanged code.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
